[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "python-dotenv>=1.2.2",
    "slack-sdk>=3.43.0",
    "uvicorn>=0.51.0",
    "pydantic-settings"
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]