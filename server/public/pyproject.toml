[project]
name = "public"
version = "0.1.0"
description = "Public ingress: Slack events in, entity graph into Postgres."
requires-python = ">=3.13"
dependencies = [
    # ── API surface ──────────────────────────────────────────────────────────
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "slack-sdk>=3.43.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings",

    # ── src/inject: the entity-linking blackbox ──────────────────────────────
    "openai>=2.44.0",          # coref + merge-review calls (src/2_chains)
    "numpy>=2.0",              # vectors and scoring (src/3_encode, src/4_link)
    "psycopg[binary]>=3.2",    # the Postgres write path (src/5_store)
    "spacy>=3.8.14",           # span inventory (utils/spans)
    "transformers>=4.47.0",    # nomic tokenizer + model (src/3_encode)
    "torch>=2.12.1",           # transformers backend
    # nomic-embed-text-v1.5 ships its own modelling code and loads it with
    # trust_remote_code; that code imports einops, which nothing else pulls in.
    # Missing it fails at first encode, not at import, so it does not show up
    # until a real run.
    "einops>=0.8",
    "hnswlib>=0.8.0",          # ANN blocking above ann_k chains (src/4_link)
    "scikit-learn>=1.9.0",     # PairScorer.fit, only over labelled pairs

    # The spaCy model is data, not code, and `spacy` does not pull it in. Pinned
    # as a wheel URL rather than left to `python -m spacy download` so the image
    # builds reproducibly and offline — a download step in a Dockerfile is a
    # network dependency at build time and a different model version per rebuild.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required for the en_core_web_sm wheel URL above; hatchling refuses direct
# references without it.
[tool.hatch.metadata]
allow-direct-references = true

# `src` is the import root: app.py does `from src.security.slack import ...` and
# the ingest entry point is `src.inject.main`.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests/public"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
