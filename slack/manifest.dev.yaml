_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Loupy
  description: Answers from your team's notes and code, with the sources linked.
  long_description: >-
    Loupy reads the notes and code your team already keeps and answers
    questions with the passages it used, linked so you can check them.
    Mention @Loupy in a channel and it replies in the thread. It says when a
    question rests on a premise the notes contradict, and asks which one you
    mean when a name could be several things. It never reads direct messages
    and only indexes what you connect.
  background_color: "#1D1D1F"

features:
  bot_user:
    display_name: Loupy
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  redirect_urls:
    - https://extras-chevron-banish.ngrok-free.dev/slack/oauth/callback
  scopes:
    # Exactly the set in ADRs/slack/connector.md entry 4. "Never DMs" is a
    # scope decision: im:history / mpim:history must not be added here.
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - users:read

settings:
  event_subscriptions:
    request_url: https://extras-chevron-banish.ngrok-free.dev/slack/event
    bot_events:
      - app_mention
      - app_home_opened
      # Thread replies reach the server through this; every public-channel
      # message in channels the bot is in arrives, is ACKed, and is dropped
      # unless it is a reply in a thread Nazar already answered in (ADR slack 17).
      - message.channels
      # Already subscribed on the live app (im:history granted); DMs are dropped by the router today.
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: true
  socket_mode_enabled: false
  token_rotation_enabled: false