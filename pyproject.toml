[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.0",
    "click>=8.4.2",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
    "openai>=2.44.0",
    "neo4j>=6.2.0",
    "python-dotenv>=1.2.2",
    "transformers>=4.47.0",
    "torch>=2.12.1",
    "scikit-learn>=1.9.0",
    "tqdm>=4.68.3",
    "price-parser>=0.5.1",
    "babel>=2.18.0",
    "dateparser>=1.4.1",
    "mcp>=1.28.1",
]

[project.scripts]
arena = "arena.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "anyio>=4.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "pyright>=1.1.411",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.15.20",
]
